name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install -r tests/requirements.txt

      # grammar/package.json pins the tree-sitter CLI used by the Makefile's
      # parse gate. Node 24, not 20: under Node 20 a Uint8Array that JavaScript
      # kept still reports its old length after the Zen heap grows, which fails
      # tests/js/cases/bytes_transfer.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install tree-sitter CLI
        run: npm install --prefix grammar --no-package-lock --no-audit --no-fund

      # jitcorpus runs in its own job below: on this runner its 4 shards
      # need more memory than the gate leaves, and it takes most of an hour.
      - name: Verify repository
        run: make verify VERIFY_JIT=

  jitcorpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Strict jit corpus
        run: make jitcorpus JIT_SHARDS=2

  native-jit-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build compiler
        run: make build

      - name: Verify native bytes and executable memory
        run: python3 tests/quality/jit_native.py --zen ./zen

      - name: Compare native JIT SHA-256 with C
        run: |
          set -euo pipefail
          mkdir -p build/native-jit-macos
          ./zen build tests/native/bench/sha256 --entry main.zen --backend c -o build/native-jit-macos/sha.c
          cc -O2 build/native-jit-macos/sha.c -lm -o build/native-jit-macos/sha
          build/native-jit-macos/sha 1 | tee build/native-jit-macos/expected
          ./zen build tests/native/bench/sha256 --entry main.zen --backend jit -- 1 | tee build/native-jit-macos/actual
          diff -u build/native-jit-macos/expected build/native-jit-macos/actual
