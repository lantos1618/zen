name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install -r tests/requirements.txt

      # The editor package targets Node 20, and grammar/package.json pins the
      # tree-sitter CLI used by the Makefile's parse gate.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install tree-sitter CLI
        run: npm install --prefix grammar --no-package-lock --no-audit --no-fund

      - name: Verify repository
        run: make verify
